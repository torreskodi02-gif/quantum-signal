name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 23/' android/variables.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-signal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk quantum-signal.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest quantum-signal.apk --target "$GITHUB_SHA" --title "Quantum Signal (newest build)" --notes "Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC" --latest
