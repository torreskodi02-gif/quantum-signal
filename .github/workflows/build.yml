name: build
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Decode keystore
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
        env: { KS_B64: "${{ secrets.KS_B64 }}" }
      - name: Build signed APK
        run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk quantumsignal.apk
        env: { KS_FILE: "${{ runner.temp }}/ks.jks", KS_PASS: "${{ secrets.KS_PASS }}", VC: "${{ github.run_number }}" }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v${{ github.run_number }}", files: quantumsignal.apk }
