if(fl.length-pm.length)add("warn",(fl.length-pm.length)+" message(s) waiting to send","Retrying now. They go out as soon as the server is reachable.");
if(pm.length)add("bad",pm.length+" message(s) couldn’t be sent",(pm[0].err||"Unknown error")+". Tap the message to resend or delete it.");
if(!fl.length)add("ok","No unsent messages");
const bi=await Bio.info();
if(cfg.bio)bi.ok?add("ok","Fingerprint sensor ready",bi.kind==="native"?"Using the phone’s fingerprint hardware":"Using the device unlock"):add("warn","Fingerprint unavailable",(bi.err||"")+". Your PIN still works.");else add("ok","Fingerprint unlock is off","Turn it on in Settings → Privacy and security");
if(cfg.twofa&&!bi.ok){cfg.twofa=false;F.push("Turned off Fingerprint + PIN because no fingerprint sensor is available (prevents a lock-out)")}
if(!cfg.server)add("warn","No server address","Set one in Settings → Network and updates to send messages.");
else{let up=false;
if(!Bio.native()&&location.protocol==="https:"&&/^http:/.test(cfg.server)&&!/127\.0\.0\.1|localhost/.test(cfg.server))add("warn","Browsers block http servers on https pages","Use the installed app, or put the server behind HTTPS.");
try{const h=await Net.j("/health");up=true;add("ok","Server reachable",h.users+" account"+(h.users===1?"":"s"))}catch(e){add("bad","Server not reachable",Net.msg(e)+". Check the server is running and the address "+cfg.server+" is right.")}
if(up&&cfg.token){try{const p=await Net.find(cfg.user);cfg.pub&&p.x===cfg.pub.x&&p.y===cfg.pub.y?add("ok","Your account is registered","@"+cfg.user):(add("bad","Account keys don’t match the server","Someone may have taken @"+cfg.user+", or the server was reset."),reset=1)}catch(e){e.message==="not found"?(add("bad","Your username isn’t on this server","The server data was reset."),reset=1):add("warn","Couldn’t verify your account",Net.msg(e))}}
else if(up)add("warn","No username yet","Choose one in Settings → Network and updates.")}
UP.s==="avail"?add("warn","Update available","v"+UP.v+". Tap Update now at the top of Settings."):UP.s==="error"?add("warn","Couldn’t check for updates"):add("ok","App is up to date");
ERR.length?add("warn",ERR.length+" error"+(ERR.length>1?"s":"")+" logged this session",ERR.slice(-3).map(e=>e.w+": "+e.m).join(" · ")):add("ok","No errors logged");
save();if(!locked)render();if(cfg.token)poll();
const nb=L.filter(x=>x.k==="bad").length,nw=L.filter(x=>x.k==="warn").length;
const txt="Quantum Signal v"+VER+" report\n"+L.map(x=>(x.k==="ok"?"[ok] ":x.k==="warn"?"[!] ":"[x] ")+x.n+(x.d?" - "+x.d:"")).join("\n")+(F.length?"\nFixed: "+F.join("; "):"")+(ERR.length?"\nLog:\n"+ERR.map(e=>new Date(e.t).toISOString().slice(11,19)+" "+e.w+" "+e.m).join("\n"):"");
const html=`<p class="hint">${nb?nb+" problem"+(nb>1?"s":""):"No problems"}${nw?", "+nw+" warning"+(nw>1?"s":""):""}${F.length?" · "+F.length+" fixed automatically":""}</p>`+F.map(f=>`<div class="dg ok"><b>🔧 Fixed</b><small>${E(f)}</small></div>`).join("")+L.map(x=>`<div class="dg ${x.k}"><b>${x.k==="ok"?"✓":x.k==="warn"?"⚠":"✗"} ${E(x.n)}</b>${x.d?`<small>${E(x.d)}</small>`:""}</div>`).join("");
const items=[["Copy report",async()=>{toast(await copy(txt)?"Report copied":"Couldn’t copy the report")}],["Run again",diag]];
if(reset)items.unshift(["Reset server account",()=>A.resetnet()]);
sheet("Error check",items,html)}
function ask(t,ph,cb,extra=[]){window._u="";sheet(t,[["Save",()=>cb(window._u.trim().toLowerCase()===window._u.trim()?window._u.trim():window._u.trim())],...extra],`<div style="padding:4px 16px"><input class="srch" style="margin:0;width:100%;box-sizing:border-box" placeholder="${ph}" ${ph==="Current PIN"?'type="password" inputmode="numeric" maxlength="4"':""} autocapitalize="none" autocomplete="off" oninput="window._u=this.value"></div>`)}
Object.assign(A,{
newchat(){ask("Find by username","username",async v=>{const u=v.toLowerCase();if(!C().token)return toast("Choose a username in Settings first");if(u===C().user)return toast("That’s your own username");try{const pub=await Net.find(u);if(!S.chats.some(c=>c.id===u))S.chats.push({id:u,name:u,msgs:[],dis:C().disap,ver:false,unread:0,pub});save();A.open(u)}catch(e){toast(e.message==="not found"?"No user “"+u+"” found":"Couldn’t search: "+Net.msg(e))}})},
server(){ask("Server address","http://YOUR_IP:3000",v=>{C().server=v&&!/^https?:\/\//.test(v)?"http://"+v:v;save();render()})},
claim(){ask("Choose a username","3–20 letters, numbers or _",async v=>{if(!C().server)return toast("Set the server address first");try{await Net.reg(v.toLowerCase());toast("You are @"+v.toLowerCase());render()}catch(e){toast(e.message==="taken"?"That username is taken":"Could not register: "+Net.msg(e))}})},
skins(){sheet("Style",Object.entries(SK).map(([k,x])=>[x.n,()=>{C().skin=k;C().acc=x.acc;C().theme=x.dark?"dark":x.light?"light":"system";save();applyTheme();render()}]))},
async upd(s){try{const d=await(await fetch("version.json?"+Date.now(),{cache:"no-store"})).json();if(d.version===VER){if(!s)toast("You’re up to date (v"+VER+")");return}
sheet("Update available · v"+d.version,[["Update now",async()=>{try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.replace(location.pathname+"?v="+d.version)}]],`<p class="hint">${E(d.notes||"")}</p>`)}catch(e){if(!s)toast("In-app updates work in the hosted app")}}});
let UP={s:"idle",v:"",notes:""};
const rs=()=>{if(!locked&&view==="list"&&tab==="set")render()};
const upCard=()=>{const a=UP.s;return`<div class="upc ${a}"><div><b>${a==="avail"?"Update available · v"+E(UP.v):a==="checking"?"Checking for updates…":a==="applying"?"Installing update…":a==="latest"?"You’re up to date":a==="error"?"Couldn’t check for updates":"Quantum Signal v"+VER}</b><small>${a==="avail"?E(UP.notes||"A new version is ready."):a==="error"?"Updates work in the installed or hosted app.":"Version "+VER}</small></div><button data-a="updgo">${a==="avail"?"Update now":a==="checking"?"Checking…":a==="applying"?"Updating…":"Check again"}</button></div>`};
async function chkUp(){if(UP.s==="checking"||UP.s==="applying")return;const was=UP.s;UP.s="checking";rs();
try{const d=await(await fetch("version.json?"+Date.now(),{cache:"no-store"})).json();if(!d.version)throw 0;if(d.server&&!C().token&&C().server!==d.server){C().server=d.server;save()}
if(!newer(d.version,VER))UP.s="latest";else{UP={s:"avail",v:String(d.version),notes:d.notes||""};if(was!=="avail")toast("Update available: v"+UP.v)}}catch(e){UP.s="error"}rs();if(!locked&&view==="list"&&tab==="chats")render()}
async function applyUp(){UP.s="applying";rs();toast("Downloading update…");try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.replace(location.pathname+"?v="+UP.v+"&t="+Date.now())}
A.updgo=()=>UP.s==="avail"?applyUp():chkUp();
A.upd=()=>chkUp();
const t0=A.tab;A.tab=v=>{t0(v);if(v==="set")chkUp()};
load();applyTheme();render();if(Bio.native()&&C().bio&&C().pin&&!C().twofa)setTimeout(A.bio,400);setTimeout(()=>A.upd(1),3000);
</script></body></html>
